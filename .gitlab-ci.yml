# CI for the skillshub/claude-marketplace repo itself.
# Runs on every MR and push to main.
#
# Jobs:
#   validate-json       — Ensures marketplace.json and all plugin.json files parse cleanly.
#   validate-yaml       — Ensures the skill-scanner-component spec YAML is valid.
#   lint-shell          — shellcheck on all bash/sh scripts in plugins/ (hooks, bin, scripts).
#   check-essentials    — Verifies bundled skills in essentials/ match their source plugin dirs.
#   skill-safety-scan   — LLM-as-judge on changed skills, agents, and commands across all plugins.

stages:
  - validate
  - scan

# ── JSON validation ───────────────────────────────────────────────────────────

validate-json:
  stage: validate
  image: python:3.12-slim-bookworm
  script:
    - |
      set -e
      echo "Validating .claude-plugin/marketplace.json..."
      python3 -c "import json, sys; json.load(open('.claude-plugin/marketplace.json')); print('  OK')"

      echo "Validating all plugin.json files..."
      find plugins -name 'plugin.json' -path '*/.claude-plugin/*' | sort | while read f; do
        python3 -c "import json, sys; json.load(open('$f')); print('  OK: $f')"
      done

      echo "All JSON files valid."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── YAML validation for component spec ───────────────────────────────────────
# Uses the pre-built scanner image so no runtime pip install is needed —
# pyyaml is already installed in the image from requirements.lock.

validate-yaml:
  stage: validate
  image:
    name: registry.gitlab.company.com/skillshub/claude-marketplace/skill-scanner:latest
    entrypoint: [""]
  variables:
    COMPONENT_SPEC: "skill-scanner-component/templates/skill-scanner-component.yml"
  script:
    - python3 ci/validate-component-spec.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - skill-scanner-component/templates/skill-scanner-component.yml
        - ci/validate-component-spec.py
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Shell script linting ─────────────────────────────────────────────────────
# Runs shellcheck (error severity only) on every bash/sh script across plugins/.
# Covers hooks, skill scripts, and bin/ helpers. Python and JSON files are skipped.
# Uses --severity=error so vendored scripts don't fail on style — only genuine bugs block.

lint-shell:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache shellcheck file
  script:
    - |
      set -e
      # Collect all shell scripts: .sh files plus extensionless files with a bash/sh shebang.
      # Explicitly skip .py, .json, .md, .yaml, .yml, .cmd, and __init__ files.
      SCRIPTS=""
      while IFS= read -r f; do
        case "$f" in
          *.py|*.json|*.md|*.yaml|*.yml|*.cmd|*/__init__) continue ;;
          *.sh) SCRIPTS="$SCRIPTS $f" ;;
          *)
            if head -1 "$f" 2>/dev/null | grep -qE '^#!.*(bash|sh)'; then
              SCRIPTS="$SCRIPTS $f"
            fi
            ;;
        esac
      done < <(find plugins -type f)

      if [ -z "$SCRIPTS" ]; then
        echo "No shell scripts found."
        exit 0
      fi

      COUNT=$(echo "$SCRIPTS" | wc -w)
      echo "Found $COUNT shell script(s) to lint."
      # shellcheck: error severity only (style warnings are noise on vendored code)
      # SC1091: don't fail on unresolvable 'source' paths in vendored scripts
      # shellcheck disable=SC2086 — SCRIPTS is intentionally word-split here
      shellcheck --severity=error --exclude=SC1091 $SCRIPTS
      echo "All shell scripts passed shellcheck."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - plugins/**/*.sh
        - plugins/**/hooks/**/*
        - plugins/**/bin/**/*
        - plugins/**/scripts/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - plugins/**/*.sh
        - plugins/**/hooks/**/*
        - plugins/**/bin/**/*
        - plugins/**/scripts/**/*
    - when: never

# ── Essentials drift check ───────────────────────────────────────────────────
# Verifies that skills bundled in plugins/essentials/ are byte-for-byte identical
# to their source plugin dirs (superpowers, anthropic-feature-dev, anthropic-pr-review).
# Fails if any file in essentials is missing or differs from its canonical source.

check-essentials:
  stage: validate
  image: python:3.12-slim-bookworm
  script:
    - python3 ci/check-essentials-drift.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - plugins/essentials/**/*
        - plugins/superpowers/skills/**/*
        - plugins/anthropic-feature-dev/**/*
        - plugins/anthropic-pr-review/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - plugins/essentials/**/*
        - plugins/superpowers/skills/**/*
        - plugins/anthropic-feature-dev/**/*
        - plugins/anthropic-pr-review/**/*
    - when: never

# ── Skill safety scan across all plugins ─────────────────────────────────────
# Scans all skills, agents, and commands across every plugin directory.
# On MRs, only changed instruction files are scanned. On push to main, full scan.

include:
  - component: gitlab.company.com/skillshub/claude-marketplace/skill-scanner-component/skill-scanner-component@~latest
    inputs:
      stage: "scan"
      skills_dir: "plugins"
      fail_on_review: true
      threshold: 0.90

# Note: GitLab CI variables: does not evaluate shell commands — SCANNER_FILES
# must be set inside the script: block, not via variables:.
skill-safety-scan:
  variables:
    # Ensure a full clone so git diff against the target branch ref works.
    GIT_DEPTH: "0"
  script:
    - |
      # On MR pipelines, restrict to only the instruction files touched in this MR.
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        # Fetch the target branch so the diff ref resolves.
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        # Match skills/agents/commands in any plugin directory under plugins/.
        # Prepend CI_PROJECT_DIR so paths are absolute — scanner.py resolves relative
        # paths against SCANNER_SKILLS_DIR, which would otherwise double-up the prefix.
        CHANGED=$(git diff --name-only \
          "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}...HEAD" \
          | grep -E '^plugins/[^/]+/(skills/.*\.md|agents/.*\.md|commands/.*\.md)$' \
          | sed "s|^|${CI_PROJECT_DIR}/|" \
          | tr '\n' ',' | sed 's/,$//')
        if [ -n "$CHANGED" ]; then
          export SCANNER_FILES="$CHANGED"
          echo "Targeted scan: $SCANNER_FILES"
        else
          echo "No changed instruction files detected — nothing to scan."
          exit 0
        fi
      else
        echo "Push to main — running full scan of skills, agents, and commands."
      fi
      python /scanner/scanner.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - plugins/*/skills/**/*.md
        - plugins/*/agents/**/*.md
        - plugins/*/commands/**/*.md
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - plugins/*/skills/**/*.md
        - plugins/*/agents/**/*.md
        - plugins/*/commands/**/*.md
    - when: never
