# CI for the platform-engineering/skillshub/claude-marketplace repo itself.
# Runs on every MR and push to main.
#
# Jobs:
#   validate-json       — Ensures marketplace.json and all plugin.json files parse cleanly.
#   lint-shell          — shellcheck on all bash/sh scripts in plugins/ (hooks, bin, scripts).
#   skillspector        — SkillSpector static security scan across plugins (report-only; see below).
#
# workflow: MR and main-branch pipelines behave as before. web/schedule pipelines additionally
# set SKILLSPECTOR_SCOPE=all so SkillSpector does a full scan instead of a changed-files-only scan.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      variables:
        SKILLSPECTOR_SCOPE: "all"
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        SKILLSPECTOR_SCOPE: "all"
    - when: always

stages:
  - validate
  - scan

# ── JSON validation ───────────────────────────────────────────────────────────

validate-json:
  stage: validate
  image: registry.access.redhat.com/hi/python:3.12-builder
  script:
    - |
      set -e
      echo "Validating .claude-plugin/marketplace.json..."
      python3 -c "import json, sys; json.load(open('.claude-plugin/marketplace.json')); print('  OK')"

      echo "Validating all plugin.json files..."
      find plugins -name 'plugin.json' -path '*/.claude-plugin/*' | sort | while read f; do
        python3 -c "import json, sys; json.load(open('$f')); print('  OK: $f')"
      done

      echo "All JSON files valid."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Shell script linting ─────────────────────────────────────────────────────
# Runs shellcheck (error severity only) on every bash/sh script across plugins/.
# Covers hooks, skill scripts, and bin/ helpers. Python and JSON files are skipped.
# Uses --severity=error so vendored scripts don't fail on style — only genuine bugs block.

lint-shell:
  stage: validate
  # Hardened image has no shellcheck binary preinstalled, so pip-install the
  # shellcheck-py wheel (it bundles the real shellcheck binary) into a venv —
  # /usr/local is root-owned and the image runs as a non-root uid — and put
  # its bin first on PATH before the rest of the script runs unchanged.
  image: registry.access.redhat.com/hi/python:3.12-builder
  before_script:
    - python3 -m venv .venv
    - .venv/bin/pip install --quiet shellcheck-py
    - export PATH="$PWD/.venv/bin:$PATH"
  script:
    - |
      set -e
      # Collect all shell scripts: .sh files plus extensionless files with a bash/sh shebang.
      # Explicitly skip .py, .json, .md, .yaml, .yml, .cmd, and __init__ files.
      SCRIPTS=""
      while IFS= read -r f; do
        case "$f" in
          *.py|*.json|*.md|*.yaml|*.yml|*.cmd|*/__init__) continue ;;
          *.sh) SCRIPTS="$SCRIPTS $f" ;;
          *)
            if head -1 "$f" 2>/dev/null | grep -qE '^#!.*(bash|sh)'; then
              SCRIPTS="$SCRIPTS $f"
            fi
            ;;
        esac
      done < <(find plugins -type f)

      if [ -z "$SCRIPTS" ]; then
        echo "No shell scripts found."
        exit 0
      fi

      COUNT=$(echo "$SCRIPTS" | wc -w)
      echo "Found $COUNT shell script(s) to lint."
      # shellcheck: error severity only (style warnings are noise on vendored code)
      # SC1091: don't fail on unresolvable 'source' paths in vendored scripts
      # shellcheck disable=SC2086 — SCRIPTS is intentionally word-split here
      shellcheck --severity=error --exclude=SC1091 $SCRIPTS
      echo "All shell scripts passed shellcheck."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - plugins/**/*.sh
        - plugins/**/hooks/**/*
        - plugins/**/bin/**/*
        - plugins/**/scripts/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - plugins/**/*.sh
        - plugins/**/hooks/**/*
        - plugins/**/bin/**/*
        - plugins/**/scripts/**/*
    - when: never

# ── AppSec skill tests ────────────────────────────────────────────────────────
# Subprocess pytest suite for the appsec-scan helper scripts, preference schema,
# and SKILL.md doc contract. Hermetic: container/network tools are stubbed via
# PATH; the docker smoke tests are env-gated (RUN_*_SMOKE=1) and skipped here.

test-appsec-scan:
  stage: validate
  # The suite shells out to git, jq and curl together, and no Hummingbird image ships all
  # three, so this stays on cimg/python:3.12 for now; plan is a Hummingbird-based custom
  # image once the internal container registry exists to host it.
  image: cimg/python:3.12
  before_script:
    - pip install --quiet pyyaml pytest
  script:
    - python3 -m pytest plugins/appsec/skills/appsec-scan/tests/ -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - plugins/appsec/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - plugins/appsec/**/*

# ── AppSec component drift check ─────────────────────────────────────────────
# Compares each appsec-scan runner against the vendored CI component snapshots in
# reference/catalog/. Runs fully offline — catalog.sh is pointed at a cache dir that
# does not exist, forcing its vendored-snapshot fallback, so no token or network is
# needed. Blocks only on CONTRACT-DRIFT (a component's declared inputs/reports no
# longer match the runner's .contract). Image pins and 90-day sync staleness are
# reported but never block: scanner-preferences.yaml states admins pin images
# independently of the component version.

check-appsec-drift:
  stage: validate
  image: registry.access.redhat.com/hi/python:3.12-builder
  before_script:
    # /usr/local is root-owned on this image (runs as non-root uid), so install into a venv.
    - python3 -m venv .venv && .venv/bin/pip install --quiet pyyaml
  script:
    - .venv/bin/python ci/check-appsec-drift.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - plugins/appsec/skills/appsec-scan/scanners/**/*
        - plugins/appsec/skills/appsec-scan/reference/catalog/**/*
        - plugins/appsec/skills/appsec-scan/config/scanner-preferences.yaml
        - plugins/appsec/skills/appsec-scan/scripts/catalog.sh
        - ci/check-appsec-drift.py
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

# ── Skill security scan across all plugins ───────────────────────────────────
# SkillSpector static scan of skills/agents/commands across every plugin directory.
# MR pipelines scan only changed instruction files (scope: changed). web/schedule
# pipelines scan everything (workflow: above sets SKILLSPECTOR_SCOPE=all, which
# overrides the `scope` input per the component's runtime-env contract).
# fail_on: none — report-only while SkillSpector's accuracy is under review.

include:
  - component: $CI_SERVER_FQDN/platform-engineering/ci-catalogue/skillspector/skillspector@~latest
    inputs:
      stage: scan
      scan_root: plugins
      scope: changed
      fail_on: none        # report-only while SkillSpector's accuracy is being reviewed
