# appsec-scan scanner preferences — admin-owned (Platform Team via CODEOWNERS).
# Schema + switching guide: see PREFERENCES.md in this directory.
#
# Runtime profile override: export APPSEC_PROFILE=<profile-name>
# Everything the skill needs is declared here so a self-hosted model only has
# to READ config, never guess endpoints. Edit the values; do not make the model
# infer them.

# ─────────────────────────────────────────────────────────────────────────
# Global settings (apply to every profile)
# ─────────────────────────────────────────────────────────────────────────
settings:
  # Master environment flag.
  #   true  = no public internet. The skill talks ONLY to the active profile's
  #           gitlab_instance and the configured image registry; any profile
  #           targeting gitlab.com is refused; "offline" is not treated as an
  #           error.
  #   false = internet available (e.g. testing against gitlab.com).
  airgap: false

  # Container runtime. auto = detect docker, then podman. Or force docker/podman.
  container_runtime: auto

  # jq powers the Step 5 severity summary. It is OPTIONAL — without it the
  # summary shows UNKNOWN but the scan still runs.
  #   prefer: host  = use jq from PATH if present.
  #   install_url   = if jq is absent, download it from here to .appsec-results/bin.
  #                   {os} and {arch} are filled from `uname` (e.g. linux/amd64,
  #                   darwin/arm64). Leave empty to just degrade to UNKNOWN.
  jq:
    prefer: host
    install_url: ""   # e.g. https://jfrog.internal/artifactory/tools/jq/{os}/{arch}/jq

  # python3 powers normalized findings, triage, coverage, and the CI gate. Without
  # it, the scan degrades to legacy counts with UNKNOWN status.
  #   prefer: host  = use python3 from PATH if present.
  #   install_url   = if python3 is absent, download a tarball from here.
  #                   {os} and {arch} are filled from `uname`. Leave empty to
  #                   rely on host python3 and degrade to legacy counts if absent.
  python:
    prefer: host
    install_url: ""   # e.g. https://jfrog.internal/artifactory/tools/python/{os}/{arch}/python.tar.gz

  # CI/CD Catalog resolution (per run).
  catalog:
    #   online  = resolve component versions live against gitlab_instance.
    #   offline = skip the network, use vendored snapshots in reference/catalog/.
    mode: online
    # Env var NAME (never the value) holding a read_api PAT. Required because the
    # lobster-thermidor catalogue is private on gitlab.com — anonymous reads get
    # 404. Preflight fails fast if this names a var that is unset, so a run can
    # never silently degrade to vendored snapshots and look like a live test.
    # Leave empty ONLY if your gitlab_instance serves the components anonymously.
    # Setup: MIGRATION.md step 0.
    auth_token_env: GITLAB_READ_TOKEN

  # Container scanning: names of env vars holding registry credentials, used both
  # when GTCS pulls a BYO image and when a local build must pull a FROM base from
  # the internal registry.
  container_registry:
    user_env: CS_REGISTRY_USER
    password_env: CS_REGISTRY_PASSWORD

  # Severity threshold for the normalized scan gate: critical|high|medium|none.
  ci_gate:
    fail_on: high

# ─────────────────────────────────────────────────────────────────────────
# Profiles
# ─────────────────────────────────────────────────────────────────────────
default_profile: catalog

profiles:
  # catalog — public private-catalogue defaults for gitlab.com testing.
  # component: is the CI/CD Catalog path that catalog.sh resolves.
  # version: ~latest means "pick the highest stable tag"; an exact pin keeps the
  #          current tag and emits an advisory when a newer stable tag exists.
  # image: is what actually RUNS locally; admins pin it independently of the
  #        component version and bump it on their own schedule.
  catalog:
    gitlab_instance: https://gitlab.com
    categories:
      sast:
        component: lobster-thermidor/devops/ci-catalogue/fortify-sast/fortify-sast
        version: ~latest
        # Images live in the catalogue's docker-images project, NOT in the
        # component project — fortify-sast has no container registry at all.
        image: registry.gitlab.com/lobster-thermidor/devops/ci-catalogue/docker-images/fortify-sca:25.2.0-jdk17-review
        runner: fortify-sast.sh
        enabled: true
      dependency_scanning:
        component: lobster-thermidor/devops/ci-catalogue/dependency-scanning/dependency-scanning
        version: ~latest
        image: registry.gitlab.com/security-products/dependency-scanning:2  # Derived from ANALYZER_IMAGE_* template vars; closest literal public default.
        runner: gitlab-dependency-scanning.sh
        enabled: true
      secret_detection:
        component: lobster-thermidor/devops/ci-catalogue/secret-detection/secret-detection
        version: ~latest
        image: registry.gitlab.com/security-products/secrets:7
        runner: secret-detection.sh
        enabled: true
      container_scanning:
        component: lobster-thermidor/devops/ci-catalogue/container-scanning/container-scanning
        version: ~latest
        image: registry.gitlab.com/security-products/container-scanning:8
        runner: gitlab-container-scanning.sh
        enabled: true

  # company — production preferences (internal GitLab + internal registry).
  # image: is what actually RUNS (admin-pinned; edit to your real internal path).
  company:
    gitlab_instance: https://gitlab.internal.example
    categories:
      sast:
        component: lobster-thermidor/devops/ci-catalogue/fortify-sast/fortify-sast
        version: ~latest
        image: jfrog.internal/security/fortify-sca:25.2.0-jdk17-review
        runner: fortify-sast.sh
        enabled: true
      dependency_scanning:
        component: lobster-thermidor/devops/ci-catalogue/dependency-scanning/dependency-scanning
        version: ~latest
        image: jfrog.internal/security/dependency-scanning:2
        runner: gitlab-dependency-scanning.sh
        enabled: true
      secret_detection:
        component: lobster-thermidor/devops/ci-catalogue/secret-detection/secret-detection
        version: ~latest
        image: jfrog.internal/security/secrets:7
        runner: secret-detection.sh
        enabled: true
      container_scanning:
        component: lobster-thermidor/devops/ci-catalogue/container-scanning/container-scanning
        version: ~latest
        image: jfrog.internal/security/container-scanning:8
        runner: gitlab-container-scanning.sh
        enabled: true
