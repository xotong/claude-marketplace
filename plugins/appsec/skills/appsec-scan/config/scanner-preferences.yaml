# appsec-scan scanner preferences — admin-owned (Platform Team via CODEOWNERS).
# Schema + switching guide: see PREFERENCES.md in this directory.
#
# Runtime profile override: export APPSEC_PROFILE=<profile-name>
# Everything the skill needs is declared here so a self-hosted model only has
# to READ config, never guess endpoints. Edit the values; do not make the model
# infer them.

# ─────────────────────────────────────────────────────────────────────────
# Global settings (apply to every profile)
# ─────────────────────────────────────────────────────────────────────────
settings:
  # Master environment flag.
  #   true  = no public internet. The skill talks ONLY to the active profile's
  #           gitlab_instance and the configured image registry; any profile
  #           targeting gitlab.com is refused; "offline" is not treated as an
  #           error.
  #   false = internet available (e.g. testing against gitlab.com).
  airgap: false

  # Container runtime. auto = detect docker, then podman. Or force docker/podman.
  container_runtime: auto

  # jq powers the Step 5 severity summary. It is OPTIONAL — without it the
  # summary shows UNKNOWN but the scan still runs.
  #   prefer: host  = use jq from PATH if present.
  #   install_url   = if jq is absent, download it from here to .appsec-results/bin.
  #                   {os} and {arch} are filled from `uname` (e.g. linux/amd64,
  #                   darwin/arm64). Leave empty to just degrade to UNKNOWN.
  jq:
    prefer: host
    install_url: ""   # e.g. https://jfrog.internal/artifactory/tools/jq/{os}/{arch}/jq

  # python3 powers normalized findings, triage, coverage, and the CI gate. Without
  # it, the scan degrades to legacy counts with UNKNOWN status.
  #   prefer: host  = use python3 from PATH if present.
  #   install_url   = if python3 is absent, download a tarball from here.
  #                   {os} and {arch} are filled from `uname`. Leave empty to
  #                   rely on host python3 and degrade to legacy counts if absent.
  python:
    prefer: host
    install_url: ""   # e.g. https://jfrog.internal/artifactory/tools/python/{os}/{arch}/python.tar.gz

  # CI/CD Catalog resolution (per run). Components are always resolved live
  # against the active profile's gitlab_instance; if that fetch fails for any
  # reason, catalog.sh falls back to the vendored snapshots in
  # reference/catalog/ automatically and says so. There is deliberately no
  # "offline" switch: exact version: pins already give reproducibility, the
  # fallback already gives airgap resilience, and forcing offline only disabled
  # drift detection (the contracts are generated from those same snapshots, so
  # the comparison could never fail).
  catalog:
    # Default for profiles that do not set their own auth_token_env below.
    # Env var NAME (never the value) holding a read_api PAT. Required because the
    # lobster-thermidor catalogue is private on gitlab.com — anonymous reads get
    # 404. Preflight fails fast if this names a var that is unset, so a run can
    # never silently degrade to vendored snapshots and look like a live test.
    # Leave empty ONLY if your gitlab_instance serves the components anonymously.
    # Setup: MIGRATION.md step 0.
    auth_token_env: GITLAB_READ_TOKEN

  # Package registries used to CHECK whether a suggested upgrade is actually
  # obtainable here, before the fix loop tries it. Leave every value empty to skip
  # the check entirely (nothing is probed, no status changes).
  #
  # These are URL TEMPLATES, not base URLs: Artifactory's API shape differs per
  # ecosystem and per deployment, so the exact URL is declared here rather than
  # guessed. Placeholders: {package} {version} {group_path} {artifact} {module}
  #
  # A template containing {version} addresses one exact version, so HTTP 200 means
  # available. A listing-style URL (pypi's simple index) is matched by searching the
  # response body for the version string. 404 means absent; anything else — timeout,
  # auth failure, 5xx — is recorded as unknown and changes nothing, because a
  # registry we could not reach is not evidence the package is missing.
  #
  # Findings whose fix exists upstream but not here become blocked_registry_gap:
  # the fix loop skips them and TRIAGE.md lists them as one batched mirroring
  # request. Container-scanning findings are never probed — those are OS packages
  # in a base image, remediated by rebuilding on a newer base, not by a registry.
  package_registries:
    npm: ""    # e.g. https://jfrog.internal/artifactory/api/npm/npm-virtual/{package}/{version}
    pypi: ""   # e.g. https://jfrog.internal/artifactory/api/pypi/pypi-virtual/simple/{package}/
    maven: ""  # e.g. https://jfrog.internal/artifactory/maven-virtual/{group_path}/{artifact}/{version}/
    go: ""     # e.g. https://jfrog.internal/artifactory/api/go/go-virtual/{module}/@v/{version}.info
    # Env var NAME holding a registry token. Leave empty for anonymous read.
    auth_token_env: ""

  # Container scanning: names of env vars holding registry credentials, used both
  # when GTCS pulls a BYO image and when a local build must pull a FROM base from
  # the internal registry.
  container_registry:
    user_env: CS_REGISTRY_USER
    password_env: CS_REGISTRY_PASSWORD

  # Severity threshold for the normalized scan gate: critical|high|medium|none.
  ci_gate:
    fail_on: high

  # Which scanner image actually runs.
  #   follow-component (default) = track the component.
  #       No image: declared  -> the template's ref is used whole. This is the norm
  #           when the catalogue names a registry you can reach.
  #       image: declared     -> it supplies the REGISTRY AND PATH (your mirror) and
  #           the template supplies the TAG, so a component bump reaches you without
  #           editing this file and without ever pulling from a public registry.
  #       Either way the candidate is pulled first as an availability check. With an
  #       image: to fall back to, an unmirrored tag warns and degrades. Without one,
  #       it stops the scan and names what to mirror — there is nothing safe to run.
  #   pinned = use image: exactly as written; no adoption, no pull check. Requires
  #       image:. Use when you need byte-identical reproducibility across runs.
  image_policy: follow-component

# ─────────────────────────────────────────────────────────────────────────
# Profiles
# ─────────────────────────────────────────────────────────────────────────
default_profile: catalog

profiles:
  # catalog — gitlab.com defaults, used by the Platform Team to test against the
  # public catalogue. Like `company`, it declares no image: or runner:. Every
  # component's template already names the image, and deriving it also picks up
  # bumps: container-scanning resolves to :8.6.31 rather than the :8 this file
  # used to hardcode.
  catalog:
    gitlab_instance: https://gitlab.com
    categories:
      sast:
        component: lobster-thermidor/devops/ci-catalogue/fortify-sast/fortify-sast
        version: ~latest
        enabled: true
      dependency_scanning:
        component: lobster-thermidor/devops/ci-catalogue/dependency-scanning/dependency-scanning
        version: ~latest
        enabled: true
      secret_detection:
        component: lobster-thermidor/devops/ci-catalogue/secret-detection/secret-detection
        version: ~latest
        enabled: true
      container_scanning:
        component: lobster-thermidor/devops/ci-catalogue/container-scanning/container-scanning
        version: ~latest
        enabled: true

  company:
    gitlab_instance: https://gitlab.internal.example
    # Internal instance serves the ci-catalogue projects to unauthenticated API
    # reads, so no PAT is needed here. This empty value overrides the global
    # settings.catalog.auth_token_env, which exists for the gitlab.com profile.
    # If your instance starts requiring auth, name an env var here instead.
    auth_token_env: ""
    # image: and runner: are omitted deliberately.
    #   image:  derived from the component template each run. Your internal
    #           catalogue's templates already name the internal registry, so
    #           there is nothing local left to declare. Requires snapshots
    #           vendored FROM your instance -- see MIGRATION.md "Re-vendor".
    #   runner: defaults to this category's shipped runner script.
    # Declare either one only to override; see PREFERENCES.md.
    categories:
      sast:
        component: lobster-thermidor/devops/ci-catalogue/fortify-sast/fortify-sast
        version: ~latest
        enabled: true
      dependency_scanning:
        component: lobster-thermidor/devops/ci-catalogue/dependency-scanning/dependency-scanning
        version: ~latest
        enabled: true
      secret_detection:
        component: lobster-thermidor/devops/ci-catalogue/secret-detection/secret-detection
        version: ~latest
        enabled: true
      container_scanning:
        component: lobster-thermidor/devops/ci-catalogue/container-scanning/container-scanning
        version: ~latest
        enabled: true
