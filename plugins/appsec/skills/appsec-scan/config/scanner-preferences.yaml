# appsec-scan scanner preferences — admin-owned (Platform Team via CODEOWNERS).
# Schema + switching guide: see PREFERENCES.md in this directory.
#
# Runtime profile override: export APPSEC_PROFILE=<profile-name>
# Everything the skill needs is declared here so a self-hosted model only has
# to READ config, never guess endpoints. Edit the values; do not make the model
# infer them.

# ─────────────────────────────────────────────────────────────────────────
# Global settings (apply to every profile)
# ─────────────────────────────────────────────────────────────────────────
settings:
  # Master environment flag.
  #   true  = no public internet. The skill talks ONLY to the active profile's
  #           gitlab_instance and the configured image registry; the public-test
  #           profile is refused; "offline" is not treated as an error.
  #   false = internet available (e.g. testing against gitlab.com).
  airgap: true

  # Container runtime. auto = detect docker, then podman. Or force docker/podman.
  container_runtime: auto

  # jq powers the Step 5 severity summary. It is OPTIONAL — without it the
  # summary shows UNKNOWN but the scan still runs.
  #   prefer: host  = use jq from PATH if present.
  #   install_url   = if jq is absent, download it from here to .appsec-results/bin.
  #                   {os} and {arch} are filled from `uname` (e.g. linux/amd64,
  #                   darwin/arm64). Leave empty to just degrade to UNKNOWN.
  jq:
    prefer: host
    install_url: ""   # e.g. https://jfrog.internal/artifactory/tools/jq/{os}/{arch}/jq

  # CI/CD Catalog resolution (per run).
  catalog:
    #   online  = resolve component versions live against gitlab_instance.
    #   offline = skip the network, use vendored snapshots in reference/catalog/.
    mode: online
    # Anonymous API reads are attempted first. If gitlab_instance rejects them,
    # the skill asks you to create a read_api PAT and name the env var holding it
    # here (e.g. GITLAB_READ_TOKEN). Leave empty for anonymous-only.
    auth_token_env: ""

  # Container scanning: names of env vars holding registry credentials, used both
  # when GTCS pulls a BYO image and when a local build must pull a FROM base from
  # the internal registry.
  container_registry:
    user_env: CS_REGISTRY_USER
    password_env: CS_REGISTRY_PASSWORD

# ─────────────────────────────────────────────────────────────────────────
# Profiles
# ─────────────────────────────────────────────────────────────────────────
default_profile: company

profiles:
  # company — production preferences (internal GitLab + internal JFrog).
  # image: is what actually RUNS (admin-pinned; edit to your JFrog path).
  # component: is the CI/CD Catalog path, resolved every run for its usage guide
  # (README) and a drift advisory telling you when to bump image:.
  # Both are placeholders below — set them to your real paths.
  company:
    gitlab_instance: https://gitlab.internal.example
    categories:
      sast:
        component: components/sast/sast
        image: jfrog.internal/security/semgrep:6
        runner: gitlab-sast.sh
        enabled: true
      dependency_scanning:
        component: components/dependency-scanning/main
        image: jfrog.internal/security/dependency-scanning:2
        runner: gitlab-dependency-scanning.sh
        enabled: true
      secret_detection:
        component: components/secret-detection/secret-detection
        image: jfrog.internal/security/secrets:7
        runner: secret-detection.sh
        enabled: true
      container_scanning:
        component: components/container-scanning/container-scanning
        image: jfrog.internal/security/container-scanning:8
        runner: gitlab-container-scanning.sh
        enabled: true
      dast_web:
        component: components/dast/dast
        image: ""          # CI-only: DAST needs a running deployed target
        runner: none
        enabled: false
      dast_api:
        component: components/dast/dast
        image: ""
        runner: none
        enabled: false
    # Legacy env-var-driven scanners — unchanged v1 behavior. Remove an entry to
    # stop offering that scanner. image comes from APPSEC_REGISTRY + *_IMAGE env.
    additional_scanners:
      parasoft_gradle: { runner: parasoft-gradle.sh, image_env: PARASOFT_IMAGE, condition: HAS_GRADLE }
      parasoft_maven:  { runner: parasoft-maven.sh,  image_env: PARASOFT_IMAGE, condition: HAS_POM_NO_GRADLE }
      pylint:          { runner: pylint.sh,          image_env: PYLINT_IMAGE,   condition: HAS_REQUIREMENTS }
      eslint:          { runner: eslint.sh,          image_env: ESLINT_IMAGE,   condition: HAS_PACKAGE_JSON }
      scantist_js:     { runner: scantist-js.sh,     image_env: SCANTIST_IMAGE, condition: HAS_PACKAGE_JSON }
      scantist_maven:  { runner: scantist-maven.sh,  image_env: SCANTIST_IMAGE, condition: HAS_POM_NO_GRADLE }
      trivy:           { runner: trivy.sh,           image_env: TRIVY_IMAGE,    condition: TRIVY_TARGET_SET }

  # public-test — end-to-end testing against the PUBLIC gitlab.com catalog and
  # public analyzer images. Requires internet; refused when settings.airgap=true.
  public-test:
    gitlab_instance: https://gitlab.com
    categories:
      sast:
        component: components/sast/sast
        image: registry.gitlab.com/security-products/semgrep:6
        runner: gitlab-sast.sh
        enabled: true
      dependency_scanning:
        component: components/dependency-scanning/main
        image: registry.gitlab.com/security-products/dependency-scanning:2
        runner: gitlab-dependency-scanning.sh
        enabled: true
      secret_detection:
        component: components/secret-detection/secret-detection
        image: registry.gitlab.com/security-products/secrets:7
        runner: secret-detection.sh
        enabled: true
      container_scanning:
        component: components/container-scanning/container-scanning
        image: registry.gitlab.com/security-products/container-scanning:8
        runner: gitlab-container-scanning.sh
        enabled: true
      dast_web:
        component: components/dast/dast
        image: ""
        runner: none
        enabled: false
      dast_api:
        component: components/dast/dast
        image: ""
        runner: none
        enabled: false
    additional_scanners: {}
