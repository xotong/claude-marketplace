spec:
  inputs:
    job-name:
      type: string
      default: 'dependency-scanning'
      description: "The name of the dependency scanning job."
    stage:
      type: string
      default: test
      description: "The stage of the dependency scanning job."
    allow_failure:
      type: boolean
      default: true
      description: "When true, a failed dependency scanning job does not fail the pipeline. When false, a failure blocks the pipeline."
    language:
      # Comma-separated, no spaces. Every job here already walks the whole repo
      # (the analyzer runs at the root; the resolution jobs `find .`), so this
      # input selects WHICH resolution jobs run -- it never scopes them. A
      # consumer with several source dirs therefore wants one include listing
      # every language, not one include per directory, which would redo
      # identical work N times.
      #
      # `regex` rather than `options` because a list is the point; it still
      # rejects a typo at include time the way `options` did. A single value
      # matches unchanged, so this is backward compatible.
      description: "Project language(s). Comma-separated, no spaces: maven, gradle, python, javascript, go"
      regex: '^(maven|gradle|python|javascript|go)(,(maven|gradle|python|javascript|go))*$'

    # Settings for all dependency resolution job
    resolution_job_registry:
      default: registry.gitlab.com/lobster-thermidor/devops/ci-catalogue/docker-images/gitlab-scanners
      description: "Defines a job image"
    resolution_job_variant:
      default: openjdk17
      description: "Define JDK version used for compilation"    
      options:
        - openjdk17
        - openjdk21
    resolution_job_tag:
      default: "toolbox:1.0.0"
      description: "Defines a job image tag"    
    analyzer_log_level:
      type: string
      default: "info"
      description: "Logging level used by the analyzer. The options are fatal, error, warn, info, debug."
      options:
        - info
        - debug
        - warn
        - error
        - fatal

    # Settings for maven resolution job.
    maven-setting-path:
      default: settings.xml
      description: "Define the maven settings file"

    # Settings for python resolution job.
    pip-index-url:
      default: "https://pypi.org/simple/"
      description: "Python package index. Applied as UV_DEFAULT_INDEX, UV_INDEX_URL and PIP_INDEX_URL so it holds for uv (current and deprecated spellings) and for pip/pip-compile."
    python-version:
      default: "3.12"
      description: "Define the python version"
    uv-version:
      default: "0.11.28"
      description: "Pinned uv version to install."
    uv-installer-base:
      default: "https://releases.astral.sh/github/uv/releases/download"
      description: "Base URL the uv installer script is fetched from. Point at an internal JFrog mirror for air-gapped runners."
    uv-python-install-mirror:
      default: "https://github.com/astral-sh/python-build-standalone/releases/download"
      description: "Base URL uv downloads the managed Python build from. Point at an internal JFrog mirror for air-gapped runners."
---

variables:
  ANALYZER_IMAGE_PREFIX: "registry.gitlab.com/security-products"
  ANALYZER_IMAGE_NAME: "dependency-scanning"
  ANALYZER_IMAGE_VERSION: "2"

# ----------------------------------------------------------------
# Main Dependency Scanning job
# This job is mandatory and responsible for doing the complete dependency analysis

"$[[ inputs.job-name ]]":
  variables:
    DS_ANALYZER_IMAGE: $ANALYZER_IMAGE_PREFIX/$ANALYZER_IMAGE_NAME:$ANALYZER_IMAGE_VERSION
    LANGUAGE: $[[ inputs.language ]]
    # The analyzer picks its own python resolver and each reads a different variable, so set all three. Inert for non-python languages.
    PIP_INDEX_URL: $[[ inputs.pip-index-url ]]
    UV_DEFAULT_INDEX: $[[ inputs.pip-index-url ]]
    UV_INDEX_URL: $[[ inputs.pip-index-url ]]
  image: "$DS_ANALYZER_IMAGE"
  stage: $[[ inputs.stage ]]
  allow_failure: $[[ inputs.allow_failure ]]
  script:
    - export DS_MAX_DEPTH=-1
    - export DS_EXCLUDED_PATHS="**/test,**/tests,**/tmp,**/node_modules,**/.git"
    - export DS_INCLUDE_DEV_DEPENDENCIES=true
    - export DS_API_TIMEOUT=15
    - export DS_API_SCAN_DOWNLOAD_DELAY=3
    - export DS_ENABLE_MANIFEST_FALLBACK=true
    - export SECURE_LOG_LEVEL="${SECURE_LOG_LEVEL:-$[[ inputs.analyzer_log_level ]]}"
    - /analyzer run
  after_script: |
    # GitLab's accepted report schema lags the analyzer (2.5.3 emits 15.2.4, this instance takes 15.2.3).
    # Match any 15.2.x: pinning the exact patch meant an analyzer bump would silently no-op here and
    # GitLab would reject the report, losing the whole dependency scan with the job still green.
    # ponytail: 15.2.x only -- a 15.3+ bump is a real schema change, so warn rather than rewrite blindly.
    if [ -f gl-dependency-scanning-report.json ]; then
      sed -i -E 's/"version": "15\.2\.[0-9]+"/"version": "15.2.3"/' gl-dependency-scanning-report.json
      grep -q '"version": "15\.2\.3"' gl-dependency-scanning-report.json \
        || echo "WARNING: unexpected report schema version $(grep -oE '\"version\": \"[0-9.]+\"' gl-dependency-scanning-report.json | head -1) - GitLab may reject this report"
    fi
  artifacts:
    access: "developer"
    paths:
      - "**/gl-sbom-*.cdx.json"
      - "gl-dependency-scanning-report.json"
    reports:
      cyclonedx: "**/gl-sbom-*.cdx.json"
      dependency_scanning: 'gl-dependency-scanning-report.json'
  rules:
    # Membership, not equality: `language` is a comma-separated list.
    - if: '$LANGUAGE =~ /(^|,)(maven|gradle|python|javascript|go)(,|$)/'

# ----------------------------------------------------------------
# Dependency Resolution jobs
# These jobs resolve a dependency graph for projects without a lockfile.

# ----------------------------------------------------------------
# Dependency Resolution for Maven
"$[[ inputs.job-name ]]-maven":
  variables:
    DS_ANALYZER_IMAGE: $ANALYZER_IMAGE_PREFIX/$ANALYZER_IMAGE_NAME:$ANALYZER_IMAGE_VERSION
    DS_MAVEN_RESOLUTION_IMAGE: $[[ inputs.resolution_job_registry ]]/$[[ inputs.resolution_job_variant ]]-$[[ inputs.resolution_job_tag ]]
    LANGUAGE: $[[ inputs.language ]]
    DS_MAVEN_RESOLUTION_EXPORTED_VARS: ADDITIONAL_CA_CERT_BUNDLE DS_MAX_DEPTH DS_EXCLUDED_PATHS DS_INCLUDE_DEV_DEPENDENCIES SECURE_LOG_LEVEL MAVEN_ARGS
  image: $DS_MAVEN_RESOLUTION_IMAGE
  stage: .pre
  allow_failure: true
  services:
    - name: $DS_ANALYZER_IMAGE
      alias: ds-analyzer
      command: ["/analyzer", "dependency-resolution-service", "--project-types", "maven"]
  script:
    - export SECURE_LOG_LEVEL="${SECURE_LOG_LEVEL:-$[[ inputs.analyzer_log_level ]]}"
    - export MAVEN_ARGS="-s $[[ inputs.maven-setting-path ]]"

    # Create the shared directory to communicate with service container.
    # World-write needed as main container and service container may run as different UIDs
    - mkdir -p .gitlab_ds && chmod 777 .gitlab_ds
    - touch .gitlab_ds/env && chmod 666 .gitlab_ds/env
    # Explicitly expose relevant variables to the service container via an env file
    - for var in $DS_MAVEN_RESOLUTION_EXPORTED_VARS; do printf '%s=%s\n' "$var" "$(printenv "$var")"; done > .gitlab_ds/env
    # Signal rea API Kdiness for service to start
    - touch ".gitlab_ds/ready_${CI_JOB_ID}" && chmod 666 ".gitlab_ds/ready_${CI_JOB_ID}"

    # Wait for dependency_resolution.sh to be generated by the service container
    - |
      TIMEOUT=60
      ELAPSED=0
      while [ ! -f .gitlab_ds/dependency_resolution.sh ] && [ $ELAPSED -lt $TIMEOUT ]; do
        sleep 1
        ELAPSED=$((ELAPSED + 1))
      done
    
      # Display service container logs in main job logs
      cat .gitlab_ds/service.log || echo "WARNING: no service logs found"

      if [ ! -f .gitlab_ds/dependency_resolution.sh ]; then
        echo "ERROR: .gitlab_ds/dependency_resolution.sh script not found after $TIMEOUT seconds"
        exit 1
      fi
    - sh .gitlab_ds/dependency_resolution.sh

  artifacts:
    paths:
      - '**/maven.graph.json'
    when: always
  rules:
    # Guard on a real pom.xml, the way the gradle job guards on gradlew. Without
    # it, naming maven in `language` spins up a resolution job on a repo that has
    # no maven project: the service writes an empty resolution script, the job
    # goes green, and minutes are burned for nothing.
    - if: '$LANGUAGE =~ /(^|,)maven(,|$)/'
      exists:
        - '**/pom.xml'

# ----------------------------------------------------------------
# Dependency Resolution for Gradle
"$[[ inputs.job-name ]]-gradle":
  variables:
    DS_ANALYZER_IMAGE: $ANALYZER_IMAGE_PREFIX/$ANALYZER_IMAGE_NAME:$ANALYZER_IMAGE_VERSION
    DS_GRADLE_RESOLUTION_IMAGE: $[[ inputs.resolution_job_registry ]]/$[[ inputs.resolution_job_variant ]]-$[[ inputs.resolution_job_tag ]]
    DS_GRADLE_RESOLUTION_EXPORTED_VARS: ADDITIONAL_CA_CERT_BUNDLE DS_MAX_DEPTH DS_EXCLUDED_PATHS DS_INCLUDE_DEV_DEPENDENCIES GRADLE_CLI_OPTS SECURE_LOG_LEVEL
    LANGUAGE: $[[ inputs.language ]]
  image: $DS_GRADLE_RESOLUTION_IMAGE
  stage: .pre
  allow_failure: true
  services:
    - name: $DS_ANALYZER_IMAGE
      alias: ds-analyzer
      command: ["/analyzer", "dependency-resolution-service", "--project-types", "gradle"]
  script:
    - export SECURE_LOG_LEVEL="${SECURE_LOG_LEVEL:-$[[ inputs.analyzer_log_level ]]}"
    - export GRADLE_CLI_OPTS="-Partifactory_user=${ARTIFACTORY_USERNAME:-$ARTIFACTORY_USER} -Partifactory_password=$ARTIFACTORY_PASSWORD"
    
    # Create the shared directory to communicate with service container.
    # World-write needed as main container and service container may run as different UIDs
    - mkdir -p .gitlab_ds && chmod 777 .gitlab_ds
    - touch .gitlab_ds/env && chmod 666 .gitlab_ds/env
    # Explicitly expose relevant variables to the service container via an env file
    - for var in $DS_GRADLE_RESOLUTION_EXPORTED_VARS; do printf '%s=%s\n' "$var" "$(printenv "$var")"; done > .gitlab_ds/env
    # Signal readiness for service to start
    - touch ".gitlab_ds/ready_${CI_JOB_ID}" && chmod 666 ".gitlab_ds/ready_${CI_JOB_ID}"

    # Wait for dependency_resolution.sh to be generated by the service container
    - |
      TIMEOUT=60
      ELAPSED=0
      while [ ! -f .gitlab_ds/dependency_resolution.sh ] && [ $ELAPSED -lt $TIMEOUT ]; do
        sleep 1
        ELAPSED=$((ELAPSED + 1))
      done

      # Display service container logs in main job logs
      cat .gitlab_ds/service.log || echo "WARNING: no service logs found"

      if [ ! -f .gitlab_ds/dependency_resolution.sh ]; then
        echo "ERROR: .gitlab_ds/dependency_resolution.sh script not found after $TIMEOUT seconds"
        exit 1
      fi
    - sh .gitlab_ds/dependency_resolution.sh

  artifacts:
    paths:
      - '**/gradle.graph.txt'
    when: always
  rules:
    # Only projects with a gradle wrapper. Deliberately NOT gated on
    # $CI_COMMIT_BRANCH: that is unset on merge request pipelines, so gradle
    # resolution used to be skipped there and the SBOM silently degraded to
    # direct dependencies only -- on exactly the pipeline a reviewer reads.
    - if: '$LANGUAGE =~ /(^|,)gradle(,|$)/'
      exists:
        - '**/gradlew'

# ----------------------------------------------------------------
# Dependency Resolution for Python
"$[[ inputs.job-name ]]-python":
  variables:
    DS_ANALYZER_IMAGE: $ANALYZER_IMAGE_PREFIX/$ANALYZER_IMAGE_NAME:$ANALYZER_IMAGE_VERSION
    DS_PYTHON_RESOLUTION_IMAGE: $[[ inputs.resolution_job_registry ]]/$[[ inputs.resolution_job_variant ]]-$[[ inputs.resolution_job_tag ]]
    LANGUAGE: $[[ inputs.language ]]
    # One index, three spellings: current uv, deprecated uv, pip/pip-compile.
    UV_DEFAULT_INDEX: $[[ inputs.pip-index-url ]]
    UV_INDEX_URL: $[[ inputs.pip-index-url ]]
    PIP_INDEX_URL: $[[ inputs.pip-index-url ]]
    UV_PYTHON_INSTALL_MIRROR: $[[ inputs.uv-python-install-mirror ]]
  image: $DS_PYTHON_RESOLUTION_IMAGE
  stage: .pre
  allow_failure: true
  script:
    - export SECURE_LOG_LEVEL="${SECURE_LOG_LEVEL:-$[[ inputs.analyzer_log_level ]]}"
  
    - echo "Installing uv"
    # ponytail: -k kept deliberately for now; see issue #1 part 2 for the TLS hardening follow-up.
    - curl -k -LsSf "$[[ inputs.uv-installer-base ]]/$[[ inputs.uv-version ]]/uv-installer.sh" | sh
    - source $HOME/.local/bin/env
    - uv --version
    # Mirror comes from UV_PYTHON_INSTALL_MIRROR in variables: above.
    - uv python install $[[ inputs.python-version ]]

    - uv python pin --global $[[ inputs.python-version ]]
    - uv venv
    - source .venv/bin/activate
    - python -V

    - mkdir -p .gitlab_ds && chmod 777 .gitlab_ds
    # Replace the generated script with a uv-based one. No --index-url flag: UV_DEFAULT_INDEX silently overrides it, so a flag would look authoritative without being so.
    # Do NOT add --no-header (the analyzer detects a lock file purely by uv's header line) or --no-annotate (the '# via' lines are its only source of the dependency graph). Keep the output named pipcompile.lock.txt -- that exact name is what the analyzer looks for.
    - |
      cat > .gitlab_ds/dependency_resolution.sh << 'EOF'
      #!/bin/sh
      set -x
      # Generated by dependency-scanning analyzer (modified for uv)
      # This script resolves dependencies using uv instead of pip-compile
      FAILED=0
      # Find all requirements.txt files and process them with uv
      for req_file in $(find . -name "requirements.txt" -type f 2>/dev/null); do
          req_dir=$(dirname "$req_file")
          echo "Processing '$req_file'"
          (cd "$req_dir" && uv pip compile --system-certs 'requirements.txt' --no-strip-extras --output-file pipcompile.lock.txt) || FAILED=$((FAILED + 1))
      done
      [ $FAILED -eq 0 ]
      EOF
      chmod +x .gitlab_ds/dependency_resolution.sh

    - sh .gitlab_ds/dependency_resolution.sh
  artifacts:
    paths:
      - '**/pipcompile.lock.txt'
    when: always
  rules:
    - if: '$LANGUAGE =~ /(^|,)python(,|$)/'


# ----------------------------------------------------------------
# Dependency Resolution for Go: deliberately none. Not a TODO.
#
# Nothing to resolve. The analyzer classifies go.mod as a LOCK file
# (pm/package_manager.go -> PackageManagerGo: {go.mod: FileTypeLockFile})
# because since Go 1.17 go.mod pins the full transitive module set via
# `// indirect`. The main job runs at the repo root with DS_MAX_DEPTH=-1, so
# every go.mod already yields a complete SBOM from a plain checkout.
#
# Nothing to call. The resolution service accepts maven, gradle and python
# only (service/flags.go: AllowedProjectTypes); there is no script_go.go, and
# an unsupported project type errors out BEFORE the service writes
# .gitlab_ds/dependency_resolution.sh. A -go job copied from the maven shape
# would therefore time out on the 60s wait loop below and exit 1 on every Go
# repo, forever, for zero SBOM gain.
#
# If Go resolution ever ships upstream, the tell is a `go` entry in
# AllowedProjectTypes -- add the job then, not before.