spec:
  inputs:
    enable_mr_pipelines:
      default: false
      type: boolean
    excluded_analyzers:
      default: ""
    excluded_paths:
      default: "spec, test, tests, tmp"
    image_prefix:
      default: "$CI_TEMPLATE_REGISTRY_HOST/security-products"
    image_suffix:
      default: ""
    image_tag:
      default: "6"
    include_experimental:
      default: false
      type: boolean
    run_advanced_sast:
      default: false
      type: boolean
    run_advanced_sast_cpp:
      default: false
      type: boolean
    run_kubesec_sast:
      default: false
      type: boolean
    search_max_depth:
      default: 4
      type: number
    stage:
      default: test
    advanced_sast_partial_scan:
      description: "Configures the scan mode for Advanced SAST in merge requests. Set to 'differential' to scan only modified files and their dependencies, improving performance."
      default: ""

---
.sast-analyzer:
  stage: $[[ inputs.stage ]]
  allow_failure: true
  # these variables are used by the analyzer
  # TODO: propagate inputs when breaking down into separate components
  # E.g. SEARCH_MAX_DEPTH is overridden in some analyzers. We should pass the input instead.
  variables:
    SEARCH_MAX_DEPTH: $[[ inputs.search_max_depth ]]
    DEFAULT_SAST_EXCLUDED_PATHS: $[[ inputs.excluded_paths ]]
    SAST_EXCLUDED_PATHS: "$DEFAULT_SAST_EXCLUDED_PATHS"
  script:
    - /analyzer run
  artifacts:
    access: 'developer'
    reports:
      sast: gl-sast-report.json
    paths:
      - "gl-sast-report.json"

.deprecated-16.8:
  extends: .sast-analyzer
  script:
    - echo "This job was deprecated in GitLab 16.8 and removed in GitLab 17.0"
    - echo "For more information see https://gitlab.com/gitlab-org/gitlab/-/issues/425085"
    - exit 1
  rules:
    - when: never

# list of extensions that are supported by gitlab-advanced-sast. Some of these are also supported by semgrep-sast
# NOTE: When adding a new extension here, make sure to remove any matching extensions from `.semgrep-with-advanced-sast-exist-rules`
.gitlab-advanced-sast-exist-rules:
  exists:
    - '**/{*.py,*.go,*.java,*.jsp,*.js,*.jsx,*.ts,*.tsx,*.cjs,*.mjs,*.cs,*.rb,*.php}'

# list of extensions that are only supported by semgrep, and not gitlab-advanced-sast
# NOTE: this list MUST NOT contain any extensions that are present in `.gitlab-advanced-sast-exist-rules`
.semgrep-with-advanced-sast-exist-rules:
  exists:
    - '**/{*.c,*.cc,*.cpp,*.c++,*.cp,*.cxx,*.h,*.hpp,*.scala,*.sc,*.swift,*.m,*.kt,*.properties,application*.yml,bootstrap*.yml,application*.yaml,bootstrap*.yaml}'

# list of extensions that are supported by semgrep-sast. Some of these are also supported by gitlab-advanced-sast
.semgrep-exist-rules:
  exists:
    - '**/{*.py,*.js,*.jsx,*.ts,*.tsx,*.cjs,*.mjs,*.c,*.cc,*.cpp,*.c++,*.cp,*.cxx,*.h,*.hpp,*.go,*.java,*.cs,*.scala,*.sc,*.php,*.swift,*.m,*.rb,*.kt,*.properties,application*.yml,bootstrap*.yml,application*.yaml,bootstrap*.yaml}'

gitlab-advanced-sast:
  extends: .sast-analyzer
  image:
    name: "$[[ inputs.image_prefix ]]/gitlab-advanced-sast:${SAST_ANALYZER_IMAGE_TAG}$[[ inputs.image_suffix ]]"
  variables:
    SAST_ANALYZER_IMAGE_TAG: 2
    SEARCH_MAX_DEPTH: 20
    ADVANCED_SAST_PARTIAL_SCAN: "$[[ inputs.advanced_sast_partial_scan ]]"
  cache:
    key: "scan-metrics-$CI_COMMIT_REF_SLUG"
    fallback_keys:
      - "scan-metrics-$CI_DEFAULT_BRANCH"
    paths:
      - "scan_metrics.csv"
  rules:
    - if: '"$[[ inputs.excluded_analyzers ]]" =~ /gitlab-advanced-sast/'
      when: never
    - if: '"$[[ inputs.run_advanced_sast ]]" != "true"'
      when: never

    # The following 3 blocks of rules define whether the job runs in a an *MR pipeline* or a *branch pipeline*
    # when an MR exists. If the job has additional rules to observe they should be added in the blocks 1 and 3
    # to cover both the *MR pipeline* and the *branch pipeline* workflows.

    # 1. Run the job in an *MR* pipeline if MR pipelines are enabled and there's an open merge request.
    - if: '"$[[ inputs.enable_mr_pipelines ]]" == "true" &&
          $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $GITLAB_FEATURES =~ /\bsast_advanced\b/'
      exists: !reference [.gitlab-advanced-sast-exist-rules, exists]
    # 2. Don't run the job in a *branch pipeline* if *MR pipelines* are enabled and there's an open merge request.
    - if: '"$[[ inputs.enable_mr_pipelines ]]" == "true" &&
          $CI_OPEN_MERGE_REQUESTS'
      when: never
    # 3. Finally, run the job in a *branch pipeline* (When MR pipelines are disabled, or it is enabled but no open MRs exist for the branch).
    - if: $CI_COMMIT_BRANCH &&
          $GITLAB_FEATURES =~ /\bsast_advanced\b/
      exists: !reference [.gitlab-advanced-sast-exist-rules, exists]


brakeman-sast:
  extends: .deprecated-16.8

flawfinder-sast:
  extends: .deprecated-16.8

kubesec-sast:
  extends: .sast-analyzer
  image:
    name: "$[[ inputs.image_prefix ]]/kubesec:$[[ inputs.image_tag ]]"
  rules:
    - if: '"$[[ inputs.excluded_analyzers ]]" =~ /kubesec/'
      when: never

    # The following 3 blocks of rules define whether the job runs in a an *MR pipeline* or a *branch pipeline*
    # when an MR exists. If the job has additional rules to observe they should be added in the blocks 1 and 3
    # to cover both the *MR pipeline* and the *branch pipeline* workflows.

    # 1. Run the job in an *MR* pipeline if MR pipelines for AST are enabled and there's an open merge request.
    - if: '"$[[ inputs.enable_mr_pipelines ]]" == "true" &&
          $CI_PIPELINE_SOURCE == "merge_request_event" &&
          "$[[ inputs.run_kubesec_sast ]]" == "true"'
    # 2. Don't run the job in a *branch pipeline* if *MR pipelines* for AST are enabled and there's an open merge request.
    - if: '"$[[ inputs.enable_mr_pipelines ]]" == "true" &&
          $CI_OPEN_MERGE_REQUESTS'
      when: never
    # 3. Finally, run the job in a *branch pipeline* (When MR pipelines are disabled for AST, or it is enabled but no open MRs exist for the branch).
    - if: '$CI_COMMIT_BRANCH &&
          "$[[ inputs.run_kubesec_sast ]]" == "true"'


mobsf-android-sast:
  extends: .deprecated-16.8

mobsf-ios-sast:
